# On commence par ou non
name: Compilation du projet atelier-test-unitaires

#Le on spécifie à quel moment le workflow doit s'exécuter. Ici, on le déclenche à chaque fois qu'il y a un push sur la branche main.
on:
  push:
#Création de nos jobs
jobs:
  compilation: #Nom du premier job qui s'execute sur un runner Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name : Va chercher le code source du projet
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Compile le projet
        run: ./mvnw compile

